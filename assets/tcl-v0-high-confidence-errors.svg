<text class="note" x="24" y="350">Phase 1 later found that recalibrating raw confidence alone also lowers this count, and that these</text>
<text class="note" x="24" y="366">test sets were too small and the SQuAD split shared passages. Source: docs/archive/tcl-v0/TCL-v0-evidence-report-v2.md.</text>
