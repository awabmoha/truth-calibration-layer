<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 468" width="900" height="468" role="img" aria-labelledby="t d">
<title id="t">Learned correctness heads vs token-probability baselines</title>
<desc id="d">Held-out test AUROC of the learned correctness head and three free token-probability baselines on nine model-dataset pairs. The head beats the best baseline only on Qwen 0.5B PopQA, by 0.012.</desc>
<style>
  .bg { fill: #fcfcfb; }
  .h1 { font: 600 17px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0b0b0b; }
  .sub, .tick, .leg, .note { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #52514e; }
  .row, .val { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0b0b0b; }
  .val { font-size: 12px; }
  .grid { stroke: #e4e3df; stroke-width: 1; }
  .axis { stroke: #8a8984; stroke-width: 1.5; }
  .link { stroke: #c9c8c2; stroke-width: 2; stroke-linecap: round; }
  .c1 { fill: #2a78d6; stroke: #fcfcfb; stroke-width: 2; } .l1 { stroke: #2a78d6; stroke-width: 2; fill: none; }
  .c2 { fill: #eb6834; stroke: #fcfcfb; stroke-width: 2; } .l2 { stroke: #eb6834; stroke-width: 2; fill: none; }
  .c0 { fill: #8a8984; stroke: #fcfcfb; stroke-width: 2; }
  .dash { stroke-dasharray: 6 4; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; }
    .h1, .row, .val { fill: #f0efec; }
    .sub, .tick, .leg, .note { fill: #c3c2b7; }
    .grid { stroke: #33332f; } .link { stroke: #4a4a45; }
    .c1 { fill: #3987e5; stroke: #1a1a19; } .l1 { stroke: #3987e5; }
    .c2 { fill: #d95926; stroke: #1a1a19; } .l2 { stroke: #d95926; }
    .c0 { fill: #a3a29b; stroke: #1a1a19; }
  }
</style>
<rect class="bg" width="900" height="468" rx="8"/>
<text class="h1" x="24" y="34">Phases 3 and 4a: learned correctness heads vs free token probabilities</text>
<text class="sub" x="24" y="54">Test AUROC on a dataset the head never saw. The head (blue) reads hidden states and also gets the</text>
<text class="sub" x="24" y="70">answer-span probability as input. It beats the strongest free baseline on 1 of 9 pairs.</text>
<circle class="c1" cx="30" cy="96" r="5"/><text class="leg" x="42" y="100">Learned head (M+R)</text>
<circle class="c0" cx="190" cy="96" r="5"/><text class="leg" x="202" y="100">Answer-span probability (preregistered baseline)</text>
<circle class="c2" cx="510" cy="96" r="5"/><text class="leg" x="522" y="100">Minimum token probability</text>
<circle cx="710" cy="96" r="4" style="fill:none;stroke:#8a8984;stroke-width:2"/><text class="leg" x="722" y="100">First-token probability</text>
