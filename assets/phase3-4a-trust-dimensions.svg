<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 496" width="980" height="496" role="img" aria-labelledby="t d">
<title id="t">Self-consistency and grounding gains over answer probability</title>
<desc id="d">AURC gain with 95% CIs for the self-consistency and grounding heads on every eligible pair at 0.5B, 3.8B and 7B. Self-consistency passes on 5 of 9 pairs, grounding on 2 of 9; neither passes its preregistered rule at any size.</desc>
<style>
  .bg { fill: #fcfcfb; }
  .h1 { font: 600 17px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0b0b0b; }
  .sub, .tick, .leg, .note { font: 12px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #52514e; }
  .row, .val { font: 13px system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0b0b0b; }
  .val { font-size: 12px; }
  .grid { stroke: #e4e3df; stroke-width: 1; }
  .axis { stroke: #8a8984; stroke-width: 1.5; }
  .link { stroke: #c9c8c2; stroke-width: 2; stroke-linecap: round; }
  .c1 { fill: #2a78d6; stroke: #fcfcfb; stroke-width: 2; } .l1 { stroke: #2a78d6; stroke-width: 2; fill: none; }
  .c2 { fill: #eb6834; stroke: #fcfcfb; stroke-width: 2; } .l2 { stroke: #eb6834; stroke-width: 2; fill: none; }
  .c0 { fill: #8a8984; stroke: #fcfcfb; stroke-width: 2; }
  .dash { stroke-dasharray: 6 4; }
  @media (prefers-color-scheme: dark) {
    .bg { fill: #1a1a19; }
    .h1, .row, .val { fill: #f0efec; }
    .sub, .tick, .leg, .note { fill: #c3c2b7; }
    .grid { stroke: #33332f; } .link { stroke: #4a4a45; }
    .c1 { fill: #3987e5; stroke: #1a1a19; } .l1 { stroke: #3987e5; }
    .c2 { fill: #d95926; stroke: #1a1a19; } .l2 { stroke: #d95926; }
    .c0 { fill: #a3a29b; stroke: #1a1a19; }
  }
</style>
<rect class="bg" width="980" height="496" rx="8"/>
<text class="h1" x="24" y="34">Phases 3 and 4a: extra trust dimensions add little to answer probability</text>
<text class="sub" x="24" y="54">Gain in selective prediction (AURC of answer probability minus AURC of the combination), mean of 5 seeds,</text>
<text class="sub" x="24" y="70">with its 95% paired bootstrap CI. A pair passed only if the CI is above zero (blue).</text>
<circle class="c1" cx="30" cy="96" r="5"/><text class="leg" x="42" y="100">CI above zero</text>
<circle class="c0" cx="160" cy="96" r="5"/><text class="leg" x="172" y="100">CI includes or is below zero</text>
